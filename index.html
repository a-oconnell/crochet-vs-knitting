<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Instructional Video and Handout - Amy O'Connell</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
    }
    h1 {
      margin-bottom: 20px;
    }
    .section {
      margin-bottom: 50px;
    }
    video {
      width: 100%;
      max-width: 800px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    iframe {
      width: 100%;
      height: 800px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Instructional Video</h1>

  <!-- VIDEO SECTION -->
  <div class="section">
    <h2>Video</h2>
    <video controls>
      <source src="smaller_video.mp4" type="video/mp4">
      Your browser does not support embedded video. 
      <a href="smaller_video.mp4">Click here to download the video.</a>
    </video>
  </div>

  <!-- PDF SECTION -->
  <div class="section">
    <h2>Handout (PDF)</h2>
    <iframe src="handout.pdf">
      Your browser does not support viewing PDFs.
      <a href="handout.pdf">Click here to download the PDF.</a>
    </iframe>
  </div>

</body>
</html>
